name: svara
description: A private offline music library with Audius and experimental YouTube discovery.
publish_to: none
version: 2.1.0+2100
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  dio: ^5.11.1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  svara_youtube:
    path: packages/svara_youtube
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/

# Desktop tests use the OS SQLite; Android runtime uses sqflite.
hooks:
  user_defines:
    sqlite3:
      source: system
